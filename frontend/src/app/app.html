<div class="np-app-shell">
  <a class="np-app-shell-skip-link" href="#main-content">{{ i18n.t('shell.skipLink') }}</a>
  @if (showAuthenticatedShell()) {
    <np-authenticated-app-shell [navigationItems]="primaryNavigationItems()" />
  }
  @if (navigating()) {
    <np-loading-error-retry
      data-testid="route-loading"
      [state]="{ kind: 'loading' }"
      [loadingLabel]="i18n.t('shell.routeLoading')"
    />
  }
  <main id="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
