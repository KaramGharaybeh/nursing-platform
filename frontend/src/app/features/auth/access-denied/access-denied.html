<section class="np-access-denied" aria-labelledby="auth-access-denied-title">
  <header class="np-access-denied-public-header">
    <span class="np-access-denied-product">Nursing Platform</span>
    <a [routerLink]="publicOffersPath">Preparation Packages</a>
    <a [routerLink]="signUpPath">Sign up</a>
  </header>
  <div class="np-access-denied-composition">
    <article class="np-access-denied-card">
      <span class="np-access-denied-icon">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="10" width="14" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" />
        </svg>
      </span>
      <h1 id="auth-access-denied-title">Access denied</h1>
      <p class="np-access-denied-description">You do not have access to this page. Choose a safe destination to continue.</p>
      <p class="np-access-denied-action">
        <a [routerLink]="accountPath">Go to account</a>
      </p>
      <span class="np-access-denied-home">Go to home</span>
      <span class="np-access-denied-sign-in">Sign in</span>
    </article>
  </div>
</section>
