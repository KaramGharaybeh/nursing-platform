<div class="np-auth-field">
  <label class="np-auth-field-label" [for]="controlId()">
    {{ label() }}
    @if (required()) {
      <span class="np-auth-field-required" aria-hidden="true">*</span>
    }
  </label>
  <input
    class="np-auth-field-input"
    [class.np-auth-field-input-error]="errorText() !== ''"
    [id]="controlId()"
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [required]="required()"
    [disabled]="disabled()"
    [attr.aria-invalid]="errorText() !== '' ? 'true' : null"
    [attr.aria-describedby]="(helperText() !== '' ? controlId() + '-helper' : '') + (helperText() !== '' && errorText() !== '' ? ' ' : '') + (errorText() !== '' ? controlId() + '-error' : '') || null"
    (input)="updateValue($event)"
  />
  @if (helperText() !== '') {
    <p class="np-auth-field-helper" [id]="controlId() + '-helper'">{{ helperText() }}</p>
  }
  @if (errorText() !== '') {
    <p class="np-auth-field-error" [id]="controlId() + '-error'">{{ errorText() }}</p>
  }
</div>
