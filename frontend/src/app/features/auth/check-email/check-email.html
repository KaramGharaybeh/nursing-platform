<section class="np-check-email" aria-labelledby="auth-check-email-title">
  <header class="np-check-email-public-header">
    <span class="np-check-email-brand">Nursing Platform</span>
    <nav aria-label="Public authentication navigation">
      <a [routerLink]="publicOffersPath">Preparation Packages</a>
      <a [routerLink]="signInPath">Sign in</a>
      <a [routerLink]="signUpPath">Sign up</a>
    </nav>
  </header>
  <div class="np-check-email-composition">
    <article class="np-check-email-card">
      <span class="np-check-email-icon" aria-hidden="true">✉</span>
      <h1 id="auth-check-email-title">Check your email</h1>
      <p class="np-check-email-intro">
        If registration was successful, a verification email has been sent.
      </p>
      <p class="np-check-email-detail">
        Please check your inbox and follow the link to verify your email address.
      </p>
      <p class="np-check-email-sign-in">
        <a [routerLink]="signInPath">Go to sign in</a>
      </p>
    </article>
  </div>
</section>
