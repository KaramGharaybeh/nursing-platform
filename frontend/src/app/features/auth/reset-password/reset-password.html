<section class="np-reset-password" aria-labelledby="auth-reset-password-title">
  <div class="np-reset-password-composition">
    <div class="np-reset-password-context" aria-hidden="true">
      <p class="np-reset-password-kicker">Nursing Platform</p>
      <div class="np-reset-password-anchor"></div>
    </div>

    <div class="np-reset-password-card">
      <div class="np-reset-password-header">
        <p class="np-reset-password-product">Nursing Platform</p>
        <h1 id="auth-reset-password-title">Reset password</h1>
        <p class="np-reset-password-instruction">
          Enter your email address and choose a new password to complete the reset.
        </p>
      </div>

      @if (tokenMissingMessage() !== '') {
        <p class="np-reset-password-error" role="alert">
          {{ tokenMissingMessage() }}
          <a [routerLink]="forgotPasswordPath">Request a new reset link</a>
        </p>
      }

      <np-form-validation-summary
        [summaryTitle]="validationSummary().title"
        [items]="validationSummary().items"
        [formErrors]="validationSummary().formErrors"
      />

      @if (backendFailureMessage() !== '') {
        <p class="np-reset-password-error" role="alert">{{ backendFailureMessage() }}</p>
      }

      <form class="np-reset-password-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <np-text-input-control
          controlId="auth-reset-password-email"
          label="Email address"
          type="email"
          [required]="true"
          [disabled]="isSubmitting()"
          [value]="emailValue"
          [errorText]="emailError"
          (valueChange)="updateEmail($event)"
        />

        <np-text-input-control
          controlId="auth-reset-password-new-password"
          label="New password"
          type="password"
          [required]="true"
          [disabled]="isSubmitting()"
          [value]="newPasswordValue"
          [errorText]="newPasswordError"
          (valueChange)="updateNewPassword($event)"
        />

        <button
          class="np-reset-password-submit"
          type="submit"
          mat-flat-button
          color="primary"
          [disabled]="isSubmitting() || isTokenMissing()"
        >
          Reset password
        </button>
      </form>
    </div>
  </div>
</section>
