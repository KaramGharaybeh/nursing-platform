<section class="np-session-expired" aria-labelledby="auth-session-expired-title">
  <header class="np-session-expired-public-header">
    <span class="np-session-expired-product">
      <svg class="np-session-expired-brand-mark" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      Nursing Platform
    </span>
    <nav aria-label="Public authentication navigation">
      <a [routerLink]="publicOffersPath">Preparation Packages</a>
      <a [routerLink]="signInPath">Sign in</a>
      <a class="np-session-expired-nav-solid" [routerLink]="signUpPath">Sign up</a>
    </nav>
  </header>
  <div class="np-session-expired-composition">
    <article class="np-session-expired-card">
      <span class="np-session-expired-icon">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
        </svg>
      </span>
      <h1 id="auth-session-expired-title">Session expired</h1>
      <p class="np-session-expired-description">Your session has ended. Sign in again to continue.</p>
      <p class="np-session-expired-action">
        <a [routerLink]="signInPath">
          Sign in again
          <svg class="np-session-expired-action-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </a>
      </p>
      <span class="np-session-expired-home">Go to home</span>
    </article>
  </div>
</section>
