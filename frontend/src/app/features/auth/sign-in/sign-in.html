<section class="np-sign-in" aria-labelledby="auth-sign-in-title">
  <header class="np-sign-in-public-header">
    <span class="np-sign-in-brand">
      <svg class="np-sign-in-brand-mark" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      Nursing Platform
    </span>
    <nav aria-label="Public authentication navigation">
      <a [routerLink]="publicOffersPath">Preparation Packages</a>
      <span class="np-sign-in-nav-current" aria-current="page">Sign in</span>
      <a class="np-sign-in-nav-pill" [routerLink]="signUpPath">Sign up</a>
    </nav>
  </header>
  <div class="np-sign-in-composition">
    <div class="np-sign-in-card">
      <div class="np-sign-in-header">
        <h1 id="auth-sign-in-title">Sign in</h1>
        <p class="np-sign-in-subtitle">Enter your credentials to access your account</p>
      </div>

      @if (backendFailureMessage() === '') {
        <np-form-validation-summary
          [summaryTitle]="validationSummary().title"
          [items]="validationSummary().items"
          [formErrors]="validationSummary().formErrors"
        />
      }

      @if (backendFailureMessage() !== '') {
        <p class="np-sign-in-error" role="alert">{{ backendFailureMessage() }}</p>
      }

      <form class="np-sign-in-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <np-text-input-control
          controlId="auth-sign-in-email"
          label="Email address"
          type="email"
          [required]="true"
          [disabled]="isSubmitting()"
          [value]="emailValue"
          [errorText]="emailError"
          (valueChange)="updateEmail($event)"
        />

        <p class="np-sign-in-recovery">
          <a [routerLink]="forgotPasswordPath">Forgot password?</a>
        </p>
        <div class="np-sign-in-password-field">
          <np-text-input-control
            controlId="auth-sign-in-password"
            label="Password"
            type="password"
            [required]="true"
            [disabled]="isSubmitting()"
            [value]="passwordValue"
            [errorText]="passwordError"
            (valueChange)="updatePassword($event)"
          />
          <svg class="np-sign-in-password-eye" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path d="M2.5 12C3.7 8 7.5 5 12 5s8.3 3 9.5 7c-1.2 4-5 7-9.5 7S3.7 16 2.5 12Z" />
          </svg>
        </div>

        <button class="np-sign-in-submit" type="submit" mat-flat-button color="primary" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>

      <p class="np-sign-in-register">
        Don't have an account? <a [routerLink]="signUpPath">Create an account</a>
      </p>
    </div>
  </div>
</section>
