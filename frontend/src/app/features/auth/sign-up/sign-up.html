<section class="np-sign-up" aria-labelledby="auth-sign-up-title">
  <header class="np-sign-up-public-header">
    <span class="np-sign-up-brand">
      <svg class="np-sign-up-brand-mark" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      Nursing Platform
    </span>
    <nav aria-label="Public authentication navigation">
      <a [routerLink]="publicOffersPath">Preparation Packages</a>
      <a class="np-sign-up-nav-pill" [routerLink]="signInPath">Sign in</a>
      <span class="np-sign-up-nav-solid" aria-current="page">Sign up</span>
    </nav>
  </header>
  <div class="np-sign-up-composition">
  <div class="np-sign-up-card">
    <h1 id="auth-sign-up-title">Create account</h1>
    <p class="np-sign-up-instruction">Enter your details to create your Nursing Platform account.</p>

    @if (backendFailureMessage() === '') {
      <np-form-validation-summary
        [summaryTitle]="validationSummary().title"
        [items]="validationSummary().items"
        [formErrors]="validationSummary().formErrors"
      />
    }

    @if (backendFailureMessage() !== '') {
      <p class="np-sign-up-error" role="alert">{{ backendFailureMessage() }}</p>
    }

    <form class="np-sign-up-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <np-auth-text-field
        controlId="auth-sign-up-email"
        label="Email address"
        type="email"
        placeholder="name@example.com"
        [required]="true"
        [disabled]="isSubmitting()"
        [value]="emailValue"
        [errorText]="emailError"
        (valueChange)="updateEmail($event)"
      />

      <np-auth-text-field
        controlId="auth-sign-up-username"
        label="Username"
        type="text"
        placeholder="Choose a username"
        [required]="true"
        [disabled]="isSubmitting()"
        [value]="usernameValue"
        [errorText]="usernameError"
        (valueChange)="updateUsername($event)"
      />

      <div class="np-sign-up-password-field">
        <np-auth-text-field
          controlId="auth-sign-up-password"
          label="Password"
          type="password"
          placeholder="••••••••"
          helperText="Use at least 8 characters, one uppercase letter, and one number."
          [required]="true"
          [disabled]="isSubmitting()"
          [value]="passwordValue"
          [errorText]="passwordError"
          (valueChange)="updatePassword($event)"
        />
        <svg class="np-sign-up-password-eye" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          <path d="M2.5 12C3.7 8 7.5 5 12 5s8.3 3 9.5 7c-1.2 4-5 7-9.5 7S3.7 16 2.5 12Z" />
        </svg>
      </div>

      <np-auth-text-field
        controlId="auth-sign-up-confirm-password"
        label="Confirm password"
        type="password"
        placeholder="••••••••"
        [required]="true"
        [disabled]="isSubmitting()"
        [value]="confirmPasswordValue"
        [errorText]="confirmPasswordError"
        (valueChange)="updateConfirmPassword($event)"
      />

      <button class="np-sign-up-submit" type="submit" mat-flat-button color="primary" [disabled]="isSubmitting()">
        <span class="np-sign-up-submit-label">
          Create account
          <svg class="np-sign-up-submit-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </span>
      </button>
    </form>

    <p class="np-sign-up-sign-in">Already have an account? <a [routerLink]="signInPath">Sign in</a></p>
  </div>
  </div>
</section>
