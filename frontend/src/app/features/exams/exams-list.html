<section class="np-exams-list" aria-labelledby="exams-title">
  <np-live-region />

  <h1 id="exams-title">{{ i18n.t('exams.title') }}</h1>
  <a [routerLink]="analyticsPath" data-testid="exam-analytics-link">{{ i18n.t('exams.viewAnalytics') }}</a>
  <a [routerLink]="historyPath" data-testid="exam-history-link">{{ i18n.t('exams.viewHistory') }}</a>

  <div class="np-exams-list-filters">
    <np-select-control
      controlId="exams-country-filter"
      [label]="i18n.t('exams.countryFilter')"
      data-testid="exams-country-filter"
      [options]="countryOptions()"
      [value]="countryId()"
      (valueChange)="onCountryChange($event)"
    />
    <np-select-control
      controlId="exams-category-filter"
      [label]="i18n.t('exams.categoryFilter')"
      data-testid="exams-category-filter"
      [options]="categoryOptions()"
      [value]="categoryId()"
      (valueChange)="onCategoryChange($event)"
    />
  </div>

  <np-loading-error-retry
    [state]="state()"
    [loadingLabel]="i18n.t('exams.loading')"
    [fallbackErrorTitle]="i18n.t('exams.loadError')"
    (retryRequested)="retry()"
  />

  @if (state().kind === 'ready') {
    @if (listState() === 'empty') {
      <np-empty-state
        kind="empty"
        [title]="i18n.t('exams.emptyTitle')"
        [description]="i18n.t('exams.emptyText')"
      />
    } @else if (listState() === 'no-results') {
      <np-empty-state
        kind="no-results"
        [title]="i18n.t('exams.noResultsTitle')"
        [description]="i18n.t('exams.noResultsText')"
      />
    } @else {
      <ul class="np-exams-list-items">
        @for (exam of result()?.items ?? []; track exam.id) {
          <li>
            <np-exam-card [exam]="exam" />
          </li>
        }
      </ul>
      <np-pagination
        [page]="page()"
        [totalPages]="result()?.totalPages ?? 0"
        [totalCount]="result()?.totalCount ?? 0"
        [itemLabel]="i18n.t('exams.itemLabel')"
        [ariaLabel]="i18n.t('exams.paginationLabel')"
        (pageRequested)="loadPage($event)"
      />
    }
  }
</section>
