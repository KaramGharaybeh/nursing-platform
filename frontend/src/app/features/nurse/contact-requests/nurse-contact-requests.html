<section class="np-nurse-contact-requests" aria-labelledby="nurse-contact-requests-title">
  <np-live-region />

  <p class="np-nurse-contact-requests-kicker">Nurse</p>
  <h1 id="nurse-contact-requests-title">Contact requests</h1>

  @if (notice() !== '') {
    <p class="np-nurse-contact-requests-notice" role="status">{{ notice() }}</p>
  }

  <np-loading-error-retry
    [state]="state()"
    loadingLabel="Loading your contact requests"
    fallbackErrorTitle="Your contact requests could not be loaded"
    (retryRequested)="retry()"
  />

  @if (state().kind === 'ready') {
    <div class="np-nurse-contact-requests-filter">
      <np-select-control
        controlId="nurse-contact-requests-status"
        label="Status"
        [required]="false"
        [value]="statusValue"
        [options]="statusOptions"
        (valueChange)="updateStatusFilter($event)"
      />
    </div>

    @if (listState() === 'empty') {
      <np-empty-state
        kind="empty"
        title="No contact requests yet."
        description="When employers request contact, their requests will appear here."
      />
    } @else if (listState() === 'no-results') {
      <np-empty-state
        kind="no-results"
        [title]="'No ' + statusLabel + ' requests.'"
        description="Try a different status or clear the filter."
        actionLabel="Clear filter"
        (actionRequested)="clearFilter()"
      />
    } @else {
      <ul class="np-nurse-contact-requests-list">
        @for (request of result()?.items ?? []; track request.id) {
          <li>
            <np-nurse-contact-request-card
              [request]="request"
              [isMutating]="isMutating(request.id)"
              [mutationError]="cardError(request.id)"
              (approveRequested)="approve($event)"
              (rejectConfirmed)="reject($event)"
            />
          </li>
        }
      </ul>
      <np-pagination
        [page]="page()"
        [totalPages]="result()?.totalPages ?? 0"
        [totalCount]="result()?.totalCount ?? 0"
        itemLabel="requests"
        ariaLabel="Contact requests pagination"
        (pageRequested)="loadPage($event)"
      />
    }
  }
</section>
