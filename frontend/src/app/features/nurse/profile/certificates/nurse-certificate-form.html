<form class="np-nurse-certificate-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (backendFailureMessage !== '') {
    <p class="np-nurse-certificate-form-error" role="alert">{{ backendFailureMessage }}</p>
  } @else {
    <np-form-validation-summary
      [summaryTitle]="validationSummary.title"
      [items]="validationSummary.items"
      [formErrors]="validationSummary.formErrors"
    />
  }

  <fieldset class="np-nurse-certificate-form-group">
    <legend>{{ i18n.t('certForm.groupCertificate') }}</legend>

    <np-text-input-control
      [controlId]="controlIds.Name"
      [label]="i18n.t('certForm.name')"
      type="text"
      [required]="true"
      [disabled]="isSubmitting"
      [value]="nameValue"
      [errorText]="nameError"
      [helperText]="i18n.t('certForm.nameHelper')"
      (valueChange)="updateName($event)"
    />

    <np-text-input-control
      [controlId]="controlIds.IssuingOrganization"
      [label]="i18n.t('certForm.issuer')"
      type="text"
      [required]="true"
      [disabled]="isSubmitting"
      [value]="issuingOrganizationValue"
      [errorText]="issuingOrganizationError"
      [helperText]="i18n.t('certForm.issuerHelper')"
      (valueChange)="updateIssuingOrganization($event)"
    />

    <np-text-input-control
      [controlId]="controlIds.CredentialId"
      [label]="i18n.t('certForm.credentialId')"
      type="text"
      [required]="false"
      [disabled]="isSubmitting"
      [value]="credentialIdValue"
      [errorText]="credentialIdError"
      [helperText]="i18n.t('certForm.credentialIdHelper')"
      (valueChange)="updateCredentialId($event)"
    />
  </fieldset>

  <fieldset class="np-nurse-certificate-form-group">
    <legend>{{ i18n.t('certForm.groupDates') }}</legend>

    <np-date-control
      [controlId]="controlIds.IssueDate"
      [label]="i18n.t('certForm.issueDate')"
      [required]="false"
      [disabled]="isSubmitting"
      [value]="issueDateValue"
      [errorText]="issueDateError"
      [helperText]="i18n.t('certForm.issueHelper')"
      (valueChange)="updateIssueDate($event)"
    />

    <np-date-control
      [controlId]="controlIds.ExpirationDate"
      [label]="i18n.t('certForm.expirationDate')"
      [required]="false"
      [disabled]="isSubmitting"
      [value]="expirationDateValue"
      [errorText]="expirationDateError"
      [helperText]="i18n.t('certForm.expirationHelper')"
      (valueChange)="updateExpirationDate($event)"
    />
  </fieldset>

  <fieldset class="np-nurse-certificate-form-group">
    <legend>{{ i18n.t('certForm.groupLink') }}</legend>

    <np-text-input-control
      [controlId]="controlIds.CredentialUrl"
      [label]="i18n.t('certForm.credentialUrl')"
      type="text"
      [required]="false"
      [disabled]="isSubmitting"
      [value]="credentialUrlValue"
      [errorText]="credentialUrlError"
      [helperText]="i18n.t('certForm.urlHelper')"
      (valueChange)="updateCredentialUrl($event)"
    />
  </fieldset>

  <div class="np-nurse-certificate-form-actions">
    <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting">
      {{ submitLabel }}
    </button>
    <button mat-button type="button" [disabled]="isSubmitting" (click)="cancel()">{{ i18n.t('details.cancel') }}</button>
  </div>
</form>
