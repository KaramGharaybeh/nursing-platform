<form class="np-nurse-education-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (backendFailureMessage !== '') {
    <p class="np-nurse-education-form-error" role="alert">{{ backendFailureMessage }}</p>
  } @else {
    <np-form-validation-summary
      [summaryTitle]="validationSummary.title"
      [items]="validationSummary.items"
      [formErrors]="validationSummary.formErrors"
    />
  }

  <fieldset class="np-nurse-education-form-group">
    <legend>Program</legend>

    <np-text-input-control
      [controlId]="controlIds.Degree"
      label="Degree"
      type="text"
      [required]="true"
      [disabled]="isSubmitting"
      [value]="degreeValue"
      [errorText]="degreeError"
      helperText="The degree or qualification you earned."
      (valueChange)="updateDegree($event)"
    />

    <np-text-input-control
      [controlId]="controlIds.FieldOfStudy"
      label="Field of study"
      type="text"
      [required]="false"
      [disabled]="isSubmitting"
      [value]="fieldOfStudyValue"
      [errorText]="fieldOfStudyError"
      helperText="Optional. For example, Critical Care Nursing."
      (valueChange)="updateFieldOfStudy($event)"
    />

    <np-text-input-control
      [controlId]="controlIds.InstitutionName"
      label="Institution name"
      type="text"
      [required]="true"
      [disabled]="isSubmitting"
      [value]="institutionNameValue"
      [errorText]="institutionNameError"
      helperText="The university, college, or institute."
      (valueChange)="updateInstitutionName($event)"
    />
  </fieldset>

  <fieldset class="np-nurse-education-form-group">
    <legend>Place and time</legend>

    <np-select-control
      [controlId]="controlIds.Country"
      label="Country"
      [required]="false"
      [disabled]="isSubmitting"
      [value]="countryValue"
      [options]="countryOptions"
      helperText="Optional. The country where this institution is located."
      (valueChange)="updateCountry($event)"
    />

    <np-date-control
      [controlId]="controlIds.StartDate"
      label="Start date"
      [required]="false"
      [disabled]="isSubmitting"
      [value]="startDateValue"
      [errorText]="startDateError"
      helperText="Optional. The date you started this program."
      (valueChange)="updateStartDate($event)"
    />

    <np-date-control
      [controlId]="controlIds.EndDate"
      label="End date"
      [required]="false"
      [disabled]="isSubmitting"
      [value]="endDateValue"
      [errorText]="endDateError"
      helperText="Optional. Leave empty for ongoing or open-ended education."
      (valueChange)="updateEndDate($event)"
    />
  </fieldset>

  <fieldset class="np-nurse-education-form-group">
    <legend>Details</legend>

    <np-textarea-control
      [controlId]="controlIds.Description"
      label="Description"
      [rows]="4"
      [required]="false"
      [disabled]="isSubmitting"
      [value]="descriptionValue"
      [errorText]="descriptionError"
      helperText="Optional. Up to 2000 characters."
      (valueChange)="updateDescription($event)"
    />
  </fieldset>

  <div class="np-nurse-education-form-actions">
    <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting">
      {{ submitLabel }}
    </button>
    <button mat-button type="button" [disabled]="isSubmitting" (click)="cancel()">Cancel</button>
  </div>
</form>
