<form class="np-nurse-experience-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (backendFailureMessage !== '') {
    <p class="np-nurse-experience-form-error" role="alert">{{ backendFailureMessage }}</p>
  } @else {
    <np-form-validation-summary
      [summaryTitle]="validationSummary.title"
      [items]="validationSummary.items"
      [formErrors]="validationSummary.formErrors"
    />
  }

  <fieldset class="np-nurse-experience-form-group">
    <legend>Role</legend>

    <np-text-input-control
      [controlId]="controlIds.JobTitle"
      label="Job title"
      type="text"
      [required]="true"
      [disabled]="isSubmitting"
      [value]="jobTitleValue"
      [errorText]="jobTitleError"
      helperText="Your title in this role, for example Staff Nurse."
      (valueChange)="updateJobTitle($event)"
    />

    <np-text-input-control
      [controlId]="controlIds.FacilityName"
      label="Facility name"
      type="text"
      [required]="true"
      [disabled]="isSubmitting"
      [value]="facilityNameValue"
      [errorText]="facilityNameError"
      helperText="The hospital, clinic, or facility where you worked."
      (valueChange)="updateFacilityName($event)"
    />
  </fieldset>

  <fieldset class="np-nurse-experience-form-group">
    <legend>Place and time</legend>

    <np-select-control
      [controlId]="controlIds.Country"
      label="Country"
      [required]="false"
      [disabled]="isSubmitting"
      [value]="countryValue"
      [options]="countryOptions"
      helperText="Optional. The country where this facility is located."
      (valueChange)="updateCountry($event)"
    />

    <np-date-control
      [controlId]="controlIds.StartDate"
      label="Start date"
      [required]="true"
      [disabled]="isSubmitting"
      [value]="startDateValue"
      [errorText]="startDateError"
      helperText="The date you started in this role."
      (valueChange)="updateStartDate($event)"
    />

    <np-checkbox-control
      [controlId]="controlIds.Current"
      label="I currently work in this role"
      [checked]="isCurrentValue"
      [required]="false"
      [disabled]="isSubmitting"
      helperText="Mark this if this role is ongoing."
      (checkedChange)="updateIsCurrent($event)"
    />

    <np-date-control
      [controlId]="controlIds.EndDate"
      label="End date"
      [required]="false"
      [disabled]="isSubmitting || isCurrentValue"
      [value]="endDateValue"
      [errorText]="endDateError"
      helperText="Optional. Leave empty when the end date is not known."
      (valueChange)="updateEndDate($event)"
    />
  </fieldset>

  <fieldset class="np-nurse-experience-form-group">
    <legend>Details</legend>

    <np-textarea-control
      [controlId]="controlIds.Description"
      label="Description"
      [rows]="4"
      [required]="false"
      [disabled]="isSubmitting"
      [value]="descriptionValue"
      [errorText]="descriptionError"
      helperText="Optional. Up to 2000 characters."
      (valueChange)="updateDescription($event)"
    />
  </fieldset>

  <div class="np-nurse-experience-form-actions">
    <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting">
      {{ submitLabel }}
    </button>
    <button mat-button type="button" [disabled]="isSubmitting" (click)="cancel()">Cancel</button>
  </div>
</form>
