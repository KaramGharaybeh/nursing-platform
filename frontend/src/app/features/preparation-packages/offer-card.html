<article class="np-offer-card" data-testid="offer-card">
  <h3>{{ offer.title }}</h3>
  @if (hasSummary()) {
    <p class="np-offer-summary">{{ offer.summary }}</p>
  }
  <p class="np-offer-country">{{ offer.countryName }}</p>
  <p class="np-offer-category">{{ offer.examCategoryName }}</p>
  <p class="np-offer-exam">{{ offer.examTitle }}</p>
  <p class="np-offer-counts">{{ offer.materialCount }} study materials · {{ offer.practiceItemCount }} practice items</p>
  <p class="np-offer-duration">{{ offer.accessDurationDays }} days of access</p>
  <a [routerLink]="detailPath()" data-testid="offer-details-link">View details</a>
</article>
