<section class="np-offers-list" aria-labelledby="offers-title">
  <np-live-region />

  <h1 id="offers-title">{{ i18n.t('pp.listTitle') }}</h1>
  <p class="np-offers-list-lead">{{ i18n.t('pp.listLead') }}</p>

  <np-loading-error-retry
    [state]="state()"
    [loadingLabel]="i18n.t('pp.listLoading')"
    [fallbackErrorTitle]="i18n.t('pp.listLoadError')"
    (retryRequested)="retry()"
  />

  @if (state().kind === 'ready') {
    @if (listState() === 'empty') {
      <np-empty-state
        kind="empty"
        [title]="i18n.t('pp.emptyTitle')"
        [description]="i18n.t('pp.emptyText')"
      />
    } @else {
      <ul class="np-offers-list-items">
        @for (offer of result()?.items ?? []; track offer.slug) {
          <li>
            <np-offer-card [offer]="offer" />
          </li>
        }
      </ul>
      <np-pagination
        [page]="page()"
        [totalPages]="result()?.totalPages ?? 0"
        [totalCount]="result()?.totalCount ?? 0"
        [itemLabel]="i18n.t('pp.itemLabel')"
        [ariaLabel]="i18n.t('pp.paginationLabel')"
        (pageRequested)="loadPage($event)"
      />
    }
  }
</section>
