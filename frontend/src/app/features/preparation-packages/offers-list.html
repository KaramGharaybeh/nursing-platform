<section class="np-offers-list" aria-labelledby="offers-title">
  <np-live-region />

  <h1 id="offers-title">Preparation packages</h1>
  <p class="np-offers-list-lead">Browse preparation packages currently available.</p>

  <np-loading-error-retry
    [state]="state()"
    loadingLabel="Loading preparation packages"
    fallbackErrorTitle="Preparation packages could not be loaded"
    (retryRequested)="retry()"
  />

  @if (state().kind === 'ready') {
    @if (listState() === 'empty') {
      <np-empty-state
        kind="empty"
        title="No preparation packages available."
        description="There are no preparation packages to show right now. Please check back later."
      />
    } @else {
      <ul class="np-offers-list-items">
        @for (offer of result()?.items ?? []; track offer.slug) {
          <li>
            <np-offer-card [offer]="offer" />
          </li>
        }
      </ul>
      <np-pagination
        [page]="page()"
        [totalPages]="result()?.totalPages ?? 0"
        [totalCount]="result()?.totalCount ?? 0"
        itemLabel="packages"
        ariaLabel="Preparation packages pagination"
        (pageRequested)="loadPage($event)"
      />
    }
  }
</section>
